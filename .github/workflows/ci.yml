name: CI

on:
  push:
    branches: [main, docs/arch-design-260717, feat/codegen-260718]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic sqlalchemy pyyaml opentelemetry-api pytest httpx
      - name: Run tests
        run: pytest -q
      - name: Lint (ruff, if available)
        run: |
          pip install ruff || true
          ruff check . || true
